name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skills, tools and manifests agree
        run: node scripts/check-skills.mjs
      - name: Claude marketplace and plugin manifests
        run: npx -y @anthropic-ai/claude-code plugin validate . --strict
      - name: Claude plugin manifest
        run: npx -y @anthropic-ai/claude-code plugin validate .claude-plugin/plugin.json --strict
